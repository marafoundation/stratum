[package]
name = "channels_sv2"
version = "8.0.0"
authors = ["The Stratum V2 Developers"]
edition = "2021"
readme = "README.md"
description = "Sv2 Channel Primitives"
documentation = "https://docs.rs/channels_sv2"
license = "MIT OR Apache-2.0"
repository = "https://github.com/stratum-mining/stratum"
homepage = "https://stratumprotocol.org"
keywords = ["stratum", "mining", "bitcoin", "protocol"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
binary_sv2 = { path = "../binary-sv2", version = "^7.0.0" }
mining_sv2 = { path = "../subprotocols/mining", version = "^12.0.0" }
template_distribution_sv2 = { path = "../subprotocols/template-distribution", version = "^7.0.0" }
tracing = { workspace = true }
bitcoin = { workspace = true }
primitive-types = { workspace = true }
hashbrown = { workspace = true, optional = true }


[features]
default = []
no_std = ["hashbrown"]

# Lets a DIAGNOSTIC build override the vardiff parameters an A/B arm or a deadband sweep needs to
# vary, from `VARDIFF_*` environment variables, with the shipped constants as defaults. Off by
# default and not enabled by any shipping profile: see `vardiff::classic::params` for why the
# override path is compiled out rather than merely left unset.
vardiff-tunable = []
